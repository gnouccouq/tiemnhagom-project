<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài viết | Tiệm Nhà Gốm</title>
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
    <link rel="stylesheet" href="../css/style.css?v=16">
    <link rel="icon" type="image/png" href="../Asset/icons/favicon.png">
    
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    
    <!-- Quill Snow CSS để định dạng nội dung HTML từ Editor -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    
    <style>
        .article-page-layout {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px 60px 20px; /* Reduced top padding for breadcrumb */
            display: grid;
            grid-template-columns: 2.5fr 1fr;
            gap: 50px;
        }
        @media (max-width: 992px) {
            .article-page-layout {
                grid-template-columns: 1fr;
            }
        }
        .article-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .article-meta {
            font-size: 0.9rem;
            color: #888;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .article-title {
            font-family: var(--font-serif);
            font-size: 2.5rem;
            margin-bottom: 20px;
            line-height: 1.3;
        }
        .article-cover {
            width: 100%;
            height: auto;
            max-height: 500px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 40px;
        }
        
        /* Ghi đè CSS Quill một chút để phù hợp giao diện đọc */
        .ql-snow .ql-editor {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.05rem;
            line-height: 1.8;
            color: #333;
            padding: 0;
            overflow-y: visible;
        }
        .ql-editor h1, .ql-editor h2, .ql-editor h3 {
            font-family: var(--font-serif);
            margin-top: 1.5em;
            margin-bottom: 0.5em;
        }
        .ql-editor img {
            max-width: 100%;
            border-radius: 8px;
            margin: 20px auto;
            display: block;
        }

        /* Sidebar CSS */
        .article-sidebar {
            position: sticky;
            top: 100px;
            height: fit-content;
        }
        .sidebar-widget {
            margin-bottom: 40px;
            background: #fffcf5;
            padding: 25px;
            border-radius: 8px;
        }
        .sidebar-widget h3 {
            font-family: var(--font-serif);
            font-size: 1.3rem;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #e0d8c3;
        }
        .sidebar-article {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            align-items: center;
        }
        .sidebar-article:last-child {
            margin-bottom: 0;
        }
        .sidebar-article img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 4px;
        }
        .sidebar-article h4 {
            font-size: 0.95rem;
            line-height: 1.4;
            margin-bottom: 5px;
            font-weight: 600;
        }
        .sidebar-article h4 a {
            color: #333;
            text-decoration: none;
            transition: 0.2s;
        }
        .sidebar-article h4 a:hover {
            color: #c0392b;
        }
        .sidebar-article .date {
            font-size: 0.75rem;
            color: #888;
        }

        /* Suggested Products CSS */
        .article-suggested-products {
            max-width: 1200px;
            margin: 0 auto 80px auto;
            padding: 0 20px;
        }
        .article-suggested-products > h3 {
            font-family: var(--font-serif);
            font-size: 1.8rem;
            text-align: center;
            margin-bottom: 30px;
        }
        .article-product-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 30px;
        }
        @media (max-width: 992px) {
            .article-product-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        @media (max-width: 576px) {
            .article-product-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 15px;
            }
        }
        
        /* Breadcrumb & Meta Row */
        .article-breadcrumb {
            margin-top: 100px; /* offset for fixed header */
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
            padding: 20px 20px 0 20px;
            font-size: 0.95rem;
            color: #666;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .article-breadcrumb a {
            color: #888;
            text-decoration: none;
            transition: 0.2s;
        }
        .article-breadcrumb a:hover {
            color: #333;
        }
        .article-breadcrumb .separator {
            color: #ccc;
            font-size: 0.8rem;
        }
        .article-breadcrumb .current {
            color: #333;
        }
        
        .article-meta-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #eee;
        }
        .article-meta-info {
            font-size: 0.95rem;
            color: #888;
        }
        .article-meta-info strong {
            color: #000;
            font-weight: 600;
        }
        .article-share {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .article-share span {
            font-size: 0.95rem;
            color: #333;
        }
        .article-share button {
            background: none;
            border: none;
            cursor: pointer;
            padding: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }
        .article-share button:hover {
            opacity: 0.7;
        }
        .article-share svg {
            width: 16px;
            height: 16px;
            fill: #000;
        }
        
        /* Feedback & Back Button */
        .article-feedback-container {
            display: flex;
            margin-top: 60px;
            margin-bottom: 30px;
            border: 1px solid #eaeaea;
            border-radius: 4px;
            overflow: hidden;
            width: fit-content;
        }
        .feedback-question {
            padding: 15px 20px;
            background: #fff;
            border-right: 1px solid #eaeaea;
            font-size: 0.95rem;
            color: #333;
            display: flex;
            align-items: center;
        }
        .feedback-btn {
            padding: 15px 25px;
            background: #fff;
            border: none;
            border-right: 1px solid #eaeaea;
            cursor: pointer;
            font-size: 0.95rem;
            color: #333;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s;
        }
        .feedback-btn:last-child {
            border-right: none;
        }
        .feedback-btn:hover {
            background: #f9f9f9;
        }
        .feedback-btn.active {
            background: #f0f8ff;
            font-weight: 600;
        }
        .article-back-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 12px 25px;
            border: 1px solid #ccc;
            background: #fff;
            color: #333;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            border-radius: 4px;
            transition: 0.2s;
            text-transform: uppercase;
        }
        .article-back-btn:hover {
            background: #f5f5f5;
        }

        @media (max-width: 768px) {
            .article-meta-row {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }
            .article-feedback-container {
                flex-direction: column;
                width: 100%;
            }
            .feedback-question, .feedback-btn {
                border-right: none;
                border-bottom: 1px solid #eaeaea;
                justify-content: center;
            }
            .feedback-btn:last-child {
                border-bottom: none;
            }
        }
    </style>
</head>
<body class="home-page">
    <div id="header-placeholder"></div>
    
    <main>
        <div id="breadcrumb-container"></div>
        
        <div class="article-page-layout">
            <div class="article-main-content" id="article-main">
                <div style="text-align: center; padding: 100px 0;"><span class="spinner"></span></div>
            </div>
            
            <aside class="article-sidebar">
                <div class="sidebar-widget">
                    <h3>Bài viết mới nhất</h3>
                    <div id="recent-articles-list">
                        <div style="text-align: center;"><span class="spinner-small"></span></div>
                    </div>
                </div>
            </aside>
        </div>

        <div class="article-suggested-products">
            <h3>Sản phẩm gợi ý</h3>
            <div id="suggested-products-list" class="article-product-grid">
                <div style="text-align: center; grid-column: 1/-1;"><span class="spinner"></span></div>
            </div>
        </div>
    </main>

    <div id="footer-placeholder"></div>
    <script type="module" src="../js/article.js"></script>
</body>
</html>
